name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: 13.53.177.195
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop my-node-app || true
            docker rm my-node-app || true
            docker pull vijaysharma26/my-node-app:latest
            docker run -d \
              --name my-node-app \
              -p 7000:8000 \
              vijaysharma26/my-node-app:latest

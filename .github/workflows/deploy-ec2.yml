name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub repo checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Docker Hub login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build NEW Docker image
      - name: Build Docker image
        run: |
          docker build --no-cache -t vijaysharma26/my-node-app:latest .

      # 4. Push NEW image to Docker Hub
      - name: Push Docker image
        run: |
          docker push vijaysharma26/my-node-app:latest

      # 5. Deploy on EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop my-node-app || true
            docker rm my-node-app || true

            docker pull vijaysharma26/my-node-app:latest

            docker run -d \
              --name my-node-app \
              -p 7000:8000 \
              --restart unless-stopped \
              vijaysharma26/my-node-app:latest

            docker image prune -f
